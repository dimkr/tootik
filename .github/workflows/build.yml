name: build

on:
  workflow_call:
    inputs:
      version:
        type: string

jobs:
  analysis:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: |
          go mod tidy -compat=$(grep -m1 ^go go.mod | cut -f 2 -d ' ')
          go generate ./migrations
          go fix ./...
          git diff --exit-code
          go vet ./...
  static:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        goarch: [amd64, arm64, arm, 386]
    steps:
      - uses: actions/checkout@v6
      - run: echo ${{ matrix.goarch }} > goarch
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            goarch
      - run: go generate ./migrations
      - run: |
          version="${{ inputs.version }}"
          echo "TOOTIK_VERSION=${version#v}" >> "$GITHUB_ENV"
      - run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go build -tags no_pprof -ldflags "-w -s -X github.com/dimkr/tootik/buildinfo.Version=${TOOTIK_VERSION}" -trimpath -o tootik-${{ matrix.goarch }} ./cmd/tootik
      - uses: actions/upload-artifact@v6
        with:
          name: tootik-${{ inputs.version }}-${{ matrix.goarch }}
          path: tootik-${{ matrix.goarch }}
          retention-days: 1
  pg-lake:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pg-lake.tar
          key: pg-lake-${{ runner.arch }}-${{ hashFiles('test/deps/build-pg-lake.sh') }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./test/deps/build-pg-lake.sh
          docker save -o "$RUNNER_TEMP/pg-lake.tar" `docker images --format '{{.Repository}}:{{.Tag}}' tootik-pg-lake`
  test:
    needs: pg-lake
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pg-lake.tar
          key: pg-lake-${{ runner.arch }}-${{ hashFiles('test/deps/build-pg-lake.sh') }}
          fail-on-cache-miss: true
      - run: docker load -i "$RUNNER_TEMP/pg-lake.tar"
      - run: |
          go generate ./migrations
          go test ./... -failfast -vet off -race
  demo:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go generate ./... && TERM=xterm-256color CGO_ENABLED=0 go run ./cmd/demo -record demo.cast
      - run: go tool termsvg export demo.cast -o demo.svg -m
      - uses: actions/upload-artifact@v6
        with:
          name: demo-${{ inputs.version }}
          path: ./demo.svg
          retention-days: 1
  client:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - run: echo ${{ matrix.goos }}/${{ matrix.goarch }} > target
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
            target
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-w -s" -trimpath -o tootik-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/tootik-client
      - uses: actions/upload-artifact@v6
        with:
          name: tootik-client-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tootik-client-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          retention-days: 1
